.nav { display:flex; flex-direction:column; gap:4px; }

.mono { font-family:var(--mono); font-size:13px; letter-spacing:0; }
.row { display:flex; align-items:center; gap:12px; } .wrapx { flex-wrap:wrap; }

function doRelink(oldPath, np, setErr){
  const v=np.trim(); if(!v) return setErr('Enter the new path for this file.');
  if(!knownPaths().has(v.toLowerCase()) || S.missing.has(v)) return setErr(`${v} was not found. Check the path and try again.`);
  S.ws.forEach(w=>w.items.forEach(i=>{ if(i.path===oldPath){ i.path=v; i.name=base(v); }}));
  S.files.forEach(f=>{ if(f.path===oldPath){ f.path=v; f.name=base(v); }});
  S.missing.delete(oldPath); S.ack.delete(oldPath); return null;
}

let tick = null;
function startTick(){ clearInterval(tick); tick=setInterval(()=>{ if(!S.vault.unlocked || !S.saved.timeout) return; S.vault.secs--; if(S.vault.secs<=0){ lockVault('Vault locked after '+S.saved.timeout+' minute'+(S.saved.timeout>1?'s':'')+' of inactivity. Enter your master password to continue.'); } else updChip(); },1000); }
function fmt(s){ return Math.floor(s/60)+':'+String(s%60).padStart(2,'0'); }
function chipText(){ return S.saved.timeout ? 'Auto-lock in '+fmt(S.vault.secs) : 'Auto-lock off'; }
function updChip(){ const el=$('#chip'); if(el) el.textContent=chipText(); }
function resetIdle(){ if(S.vault.unlocked && S.saved.timeout){ S.vault.secs=S.saved.timeout*60; updChip(); } }
function lockVault(msg){ const v=S.vault; Object.values(v.revealed).forEach(clearTimeout); v.unlocked=false; v.revealed={}; v.msg=msg||'Vault locked.'; v.attempts=0; renderSideAndView(); }
function vVault(){
  const v=S.vault;
  if(!v.unlocked) return `<h1>Vault</h1><p class="lead">Credentials stay locked until you enter the master password.</p>
    <div class="card lockbox">${v.msg?`<div class="notice ${/inactiv/.test(v.msg)?'warn':'ok'}" style="margin-bottom:16px">${ic(/inactiv/.test(v.msg)?'timer':'lock-key')}<span>${esc(v.msg)}</span></div>`:''}
      <div class="field"><label for="mp">Master password</label><input id="mp" type="password" class="in ${v.err?'err':''}" autofocus autocomplete="off">
      ${v.err?`<div class="errtext">${ic('warning-circle')}${esc(v.err)}</div>`:''}${v.attempts>=3?`<div class="errtext">${ic('warning-circle')}${v.attempts} failed attempts</div>`:''}</div>
      <button class="btn primary" data-act="vt-unlock">${ic('lock-key-open')}Unlock</button>
      <p class="caption subtle" style="margin:16px 0 0">Demo hint: the prototype password is <span class="mono">shelf-demo-2026</span>. No real encryption is used here.</p></div>`;
  const all=secrets(); const rows=all.filter(s=>(!v.fp||s.project===v.fp)&&(!v.ft||s.type===v.ft));
  return `<div class="row"><div><h1>Vault</h1></div><div class="sp"></div><span class="pill" id="chip">${chipText()}</span><a class="caption" data-act="vt-skip">Skip to timeout</a><button class="btn secondary" data-act="vt-lock">${ic('lock-key')}Lock now</button></div>
    <p class="lead">Values are masked. Reveal or copy only when you need them.</p>
    ${!all.length?`<div class="empty"><p>No secrets yet.</p></div>`:`
    <div class="row section"><div class="field" style="margin:0;width:220px"><select class="in" aria-label="Filter by project" data-vf="fp"><option value="">All projects</option>${[...new Set(all.map(s=>s.project).filter(Boolean))].map(p=>`<option ${v.fp===p?'selected':''}>${esc(p)}</option>`).join('')}</select></div>
    <div class="field" style="margin:0;width:240px"><select class="in" aria-label="Filter by type" data-vf="ft"><option value="">All types</option>${[...new Set(all.map(s=>s.type))].map(p=>`<option ${v.ft===p?'selected':''}>${esc(p)}</option>`).join('')}</select></div></div>
    ${rows.length?`<div class="list">${rows.map(s=>{ const rv=!!v.revealed[s.id];
      return `<div class="li"><div style="min-width:0;flex:1.4"><strong>${esc(s.label)}</strong><div class="caption subtle">${esc(s.type)}${s.project?', '+esc(s.project):''}${s.env?', '+esc(s.env):''}</div></div><div class="secret" style="flex:1;overflow-wrap:anywhere">${rv?esc(s.value):MASK}</div><span class="caption subtle" style="min-width:84px">${s.upd}</span>
      <button class="btn secondary sm" data-act="vt-reveal" data-id="${s.id}" aria-label="${rv?'Hide':'Reveal'} value">${ic(rv?'eye-slash':'eye')}${rv?'Hide':'Reveal'}</button><button class="btn secondary sm" data-act="vt-copy" data-id="${s.id}">${ic('copy')}Copy</button></div>`; }).join('')}</div>`:`<div class="empty"><p>No secrets match these filters.</p></div>`}`}`;
}

// ---------------------------------------------------------------- Notes (F6)
function md(src){
  const lines=esc(src).split('\n'); let out='', list=null, code=false;
  const inl=t=>t.replace(/`([^`]+)`/g,'<code>$1</code>').replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>').replace(/\*([^*]+)\*/g,'<em>$1</em>');
  const close=()=>{ if(list){ out+=`</${list}>`; list=null; } };
  for(const l of lines){
    if(l.startsWith('```')){ close(); out+= code?'</code></pre>':'<pre><code>'; code=!code; continue; }
    if(code){ out+=l+'\n'; continue; }
    let m;
    if((m=l.match(/^(#{1,2}) (.*)/))){ close(); out+=`<h${m[1].length}>${inl(m[2])}</h${m[1].length}>`; }
    else if((m=l.match(/^- \[( |x)\] (.*)/))){ if(list!=='ul'){close(); out+='<ul>'; list='ul';} out+=`<li class="task"><input type="checkbox" disabled ${m[1]==='x'?'checked':''}> <span class="${m[1]==='x'?'done':''}">${inl(m[2])}</span></li>`; }
    else if((m=l.match(/^- (.*)/))){ if(list!=='ul'){close(); out+='<ul>'; list='ul';} out+=`<li>${inl(m[1])}</li>`; }
    else if((m=l.match(/^\d+\. (.*)/))){ if(list!=='ol'){close(); out+='<ol>'; list='ol';} out+=`<li>${inl(m[1])}</li>`; }
    else if(!l.trim()){ close(); } else { close(); out+=`<p>${inl(l)}</p>`; }
  }
  close(); return out;
}
function vNotes(r){
  const list=notes();
  if(r.id){ const n=S.notes.find(x=>x.id===r.id); if(n) return vNoteEditor(n); }
  const f=S.noteFilter, rows=list.filter(n=>!f||(f==='__g'?!n.project:n.project===f)).sort((a,b)=>b.edited.localeCompare(a.edited));
  return `<h1>Notes</h1><p class="lead">Private Markdown notes, stored outside your repositories.</p>
  <div class="row section"><button class="btn primary" data-act="nt-new">${ic('plus')}New note</button><div class="sp"></div><div class="field" style="margin:0;width:220px"><select class="in" aria-label="Filter notes" data-nf="1"><option value="">All notes</option><option value="__g" ${f==='__g'?'selected':''}>General</option>${projects().map(p=>`<option ${f===p.name?'selected':''}>${esc(p.name)}</option>`).join('')}</select></div></div>
  ${!list.length?`<div class="empty"><p>No notes yet.</p><button class="btn primary" data-act="nt-new">${ic('plus')}New note</button></div>`:
   `<div class="list">${rows.map(n=>`<div class="li click" data-go="#/notes/${n.id}">${ic('note-pencil')}<div style="min-width:0"><strong>${esc(n.title)}</strong><div class="small muted">${esc(n.project||'General')}</div></div><div class="sp"></div><span class="caption subtle">Edited ${esc(n.edited)}</span>${ic('caret-right')}</div>`).join('')||'<div class="empty"><p>No notes match this filter.</p></div>'}</div>`}`;
}
function saveHtml(){ const s=S.saveState; return s==='saved'?`<span class="save saved" id="sv">${ic('check-circle')}Saved ${esc(S.saveTime)}</span>`: s==='unsaved'?`<span class="save unsaved" id="sv">${ic('pencil-simple')}Unsaved changes</span>`:`<span class="save fail" id="sv">${ic('warning-circle')}Couldn't save <a data-act="nt-retry">Retry</a></span>`; }
function vNoteEditor(n){
  return `<div class="crumb"><a href="#/notes">${ic('arrow-left')} Notes</a></div>
  <div class="row section"><input class="in" id="nt-title" style="font:600 22px var(--font);max-width:560px" value="${esc(n.title)}" aria-label="Note title"><div class="sp"></div><label class="row caption muted" style="gap:8px;cursor:pointer"><input type="checkbox" id="nt-prevtog" ${S.preview?'checked':''}>Show preview</label><span id="svbox">${saveHtml()}</span></div>
  <div class="row wrapx" style="margin:-16px 0 24px"><div class="field" style="margin:0;width:220px"><select class="in" id="nt-proj" aria-label="Project"><option value="">General</option>${projects().map(p=>`<option ${n.project===p.name?'selected':''}>${esc(p.name)}</option>`).join('')}</select></div><span class="pill">${ic('hard-drives')}Stored locally outside project roots</span><div class="sp"></div><label class="row caption muted" style="gap:8px;cursor:pointer"><input type="checkbox" id="nt-fail" ${S.saveFail?'checked':''}>Simulate save failure</label></div>
  <div class="split" ${S.preview?'':'style="grid-template-columns:1fr"'}><textarea class="in ta" id="nt-body" aria-label="Markdown" placeholder="Start with a heading, a checklist, or a command you keep forgetting.">${esc(n.body)}</textarea>${S.preview?`<div class="md" id="nt-prev" aria-label="Preview">${n.body.trim()?md(n.body):'<p class="subtle">The rendered preview appears here.</p>'}</div>`:''}</div>`;
}
function noteBind(){
  const id=route().id, n=S.notes.find(x=>x.id===id); if(!n) return;
  const body=$('#nt-body'), title=$('#nt-title'), proj=$('#nt-proj');
  const dirty=()=>{ S.saveState='unsaved'; $('#svbox').innerHTML=saveHtml(); clearTimeout(S.saveTimer); S.saveTimer=setTimeout(()=>commit(n),1000); };
  body.addEventListener('input',()=>{ n.body=body.value; const pv=$('#nt-prev'); if(pv) pv.innerHTML=n.body.trim()?md(n.body):'<p class="subtle">The rendered preview appears here.</p>'; dirty(); });
  title.addEventListener('input',()=>{ n.title=title.value; dirty(); });
  proj.addEventListener('change',()=>{ n.project=proj.value; dirty(); });
  $('#nt-fail').addEventListener('change',e=>{ S.saveFail=e.target.checked; });
  $('#nt-prevtog').addEventListener('change',e=>{ S.preview=e.target.checked; render(); const b=$('#nt-body'); b.focus(); b.setSelectionRange(b.value.length,b.value.length); });
}
let saveCount = 0;
function commit(n){ if(S.saveFail){ S.saveState='fail'; } else { saveCount++; const mm=String(4+saveCount).padStart(2,'0'); S.saveState='saved'; S.saveTime='at 09:'+mm; n.edited=TODAY+' 09:'+mm; }
  const b=$('#svbox'); if(b) b.innerHTML=saveHtml(); }

// ---------------------------------------------------------------- Settings (F7)
function vSettings(){
  const d=S.draft;
  return `<h1>Settings</h1><p class="lead">Choose how files open and when the Vault locks.</p>
  <section class="section"><h2>Editor profiles</h2><div class="list">${Object.entries(EDITORS).map(([k,l])=>`<div class="radio-row"><input type="radio" name="def" id="r-${k}" value="${k}" ${d.def===k?'checked':''} data-st="def"><label for="r-${k}" style="min-width:130px"><strong>${l}</strong>${d.def===k?' <span class="pill ok">Default</span>':''}</label>${k==='win'?`<span class="small muted">Uses the Windows file association. No executable path needed.</span>`:`<input class="in mono ${S.settingsErr&&d.def===k&&!d.paths[k].trim()?'err':''}" aria-label="${l} executable path" data-sp="${k}" value="${esc(d.paths[k])}" placeholder="Path to the editor executable">`}</div>`).join('')}</div>
  ${S.settingsErr?`<div class="errtext" style="margin-top:8px">${ic('warning-circle')}${esc(S.settingsErr)}</div>`:''}</section>
  <section class="section"><h2>Vault auto-lock</h2><div class="field" style="max-width:320px"><label for="to">Lock after inactivity</label><select id="to" class="in" data-st="timeout">${[[1,'1 minute'],[5,'5 minutes'],[15,'15 minutes'],[0,'Never while the app is open']].map(([v,l])=>`<option value="${v}" ${d.timeout===v?'selected':''}>${l}</option>`).join('')}</select></div></section>
  <div class="row"><button class="btn primary" data-act="st-save">Save settings</button><button class="btn ghost" data-act="st-reset">Reset changes</button>${S.settingsOk?`<span class="save saved">${ic('check-circle')}Settings saved</span>`:''}</div>`;
}

// ---------------------------------------------------------------- Quick open palette (F8)
function palItems(q){
  const recent=[...wsList().slice().sort((a,b)=>b.last.localeCompare(a.last)).slice(0,3).map(w=>({g:'Workspaces',t:w.name,s:w.items.length+' items',ic:'stack',go:'#/workspaces/'+w.id})), ...notes().slice().sort((a,b)=>b.edited.localeCompare(a.edited)).slice(0,3).map(n=>({g:'Notes',t:n.title,s:n.project||'General',ic:'note-pencil',go:'#/notes/'+n.id}))];
  if(!q) return recent;
  const all=[...projects().map(p=>({g:'Projects',t:p.name,s:p.root,ic:'folders',go:'#/projects/'+p.id})), ...wsList().map(w=>({g:'Workspaces',t:w.name,s:w.items.length+' items',ic:'stack',go:'#/workspaces/'+w.id})), ...files().map(f=>({g:'Config files',t:f.name,s:f.path,ic:'file-text',go:'#/config'})), ...notes().map(n=>({g:'Notes',t:n.title,s:n.project||'General',ic:'note-pencil',go:'#/notes/'+n.id}))];
  return all.filter(x=>(x.t+' '+x.s).toLowerCase().includes(q.toLowerCase()));
}
function palDraw(){
  const P=S.pal; if(!P){ $('#palette').innerHTML=''; return; }
  const items=palItems(P.q); P.items=items; if(P.sel>=items.length) P.sel=Math.max(0,items.length-1);
  let last='', html='';
  items.forEach((it,i)=>{ if(it.g!==last){ html+=`<div class="pal-grp">${it.g}</div>`; last=it.g; } html+=`<div class="pal-it ${i===P.sel?'on':''}" data-pi="${i}">${ic(it.ic)}<div style="min-width:0"><div>${esc(it.t)}</div><div class="caption subtle" style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(it.s)}</div></div></div>`; });
  $('#palette').innerHTML=`<div class="scrim" data-act="pal-scrim"><div class="pal" role="dialog" aria-modal="true" aria-label="Quick open"><input id="pq" placeholder="Search projects, workspaces, config files, notes" value="${esc(P.q)}" autocomplete="off"><div class="pal-list">${items.length?(P.q?'':'<div class="pal-grp">Recent</div>')+html:'<div class="pal-grp" style="text-transform:none;letter-spacing:0;font-size:14px;padding:16px">No results for this search</div>'}</div></div></div>`;
  const i=$('#pq'); i.focus(); i.setSelectionRange(i.value.length,i.value.length);
}
function palGo(i){ const it=S.pal.items[i]; if(!it) return; S.pal=null; palDraw(); if(it.go.startsWith('#/projects/')) S.expanded=it.go.split('/')[2]; if(location.hash===it.go) renderSideAndView(); else location.hash=it.go; }

// ---------------------------------------------------------------- events
document.addEventListener('click', e=>{
  resetIdle();
  const go=e.target.closest('[data-go]'); if(go && !e.target.closest('button')){ location.hash=go.dataset.go; return; }
  const pi=e.target.closest('[data-pi]'); if(pi){ palGo(+pi.dataset.pi); return; }
  const t=e.target.closest('[data-act]'); if(!t) { if(S.cfgMenu){ S.cfgMenu=null; render(); } return; }
  const a=t.dataset.act, id=t.dataset.id;
  if(a==='pal-scrim'){ if(e.target===t){ S.pal=null; palDraw(); } return; }
  if(a==='dlg-scrim'){ if(e.target===t){ S.dialog=null; dlgDraw(); } return; }
  switch(a){
    case 'pal-open': S.pal={q:'',sel:0}; palDraw(); break;
    case 'demo-toggle': S.demoOpen=!S.demoOpen; renderSide(); break;
    case 'ds-full': S.empty=false; renderSideAndView(); break;
    case 'ds-empty': S.empty=true; renderSideAndView(); break;
    case 'drive-toggle': S.driveF=t.checked; renderSideAndView(); break;
    case 'dlg-open': S.dialog={path:'',name:'',type:'Node worker',tags:'',errors:{}}; dlgDraw(); break;
    case 'dlg-close': S.dialog=null; dlgDraw(); break;
    case 'dlg-browse': S.dialog.path=NEW_PROJECT_PATH; if(!S.dialog.name.trim()) S.dialog.name='notify-worker'; S.dialog.errors={}; dlgDraw(); break;
    case 'dlg-save': dlgSave(); break;
    case 'proj-toggle': S.expanded = S.expanded===id?null:id; S.hl=null; render(); break;
    case 'ws-restore': { const w=S.ws.find(x=>x.id===id); S.restore={id}; S.relink=null; S.relinkErr='';
      w.last=TODAY+' '+NOW; w.lastMissing=w.items.filter(i=>itemStatus(i)!=='available').length; render(); break; }
    case 'rs-close': S.restore=null; S.relink=null; render(); break;
    case 'rs-ignore': S.ack.add(t.dataset.path); render(); break;
    case 'rl-open': S.relink=t.dataset.path; S.relinkErr=''; render(); break;
    case 'rl-cancel': S.relink=null; S.relinkErr=''; render(); break;
    case 'rl-apply': { const err=doRelink(S.relink,$('#rl-in').value,m=>{ S.relinkErr=m; return m; }); if(!err){ S.relink=null; S.relinkErr=''; const w=S.ws.find(x=>x.id===S.restore.id); w.lastMissing=w.items.filter(i=>itemStatus(i)!=='available').length; toast('Path relinked. The workspace now points to the new file.'); } render(); break; }
    case 'cf-remove': S.cfg[t.dataset.k]=''; render(); break;
    case 'cf-clear': S.cfg={project:'',env:'',kind:'',status:''}; render(); break;
    case 'cf-menu': S.cfgMenu = S.cfgMenu===id?null:id; render(); e.stopPropagation(); break;
    case 'cf-open': case 'cf-open-with': { const f=S.files.find(x=>x.id===id); const ed = a==='cf-open'?defaultEd():EDITORS[t.dataset.ed]; S.cfgMenu=null;
      S.cfgMsg={id, text:`Opened ${f.name} in ${ed}.`}; render(); break; }
    case 'cf-relink': S.cfgRelink=id; S.cfgRelinkErr=''; render(); break;
    case 'cr-cancel': S.cfgRelink=null; render(); break;
    case 'cr-apply': { const f=S.files.find(x=>x.id===id); const err=doRelink(f.path,$('#cr-in').value,m=>{ S.cfgRelinkErr=m; return m; }); if(!err){ S.cfgRelink=null; S.cfgRelinkErr=''; toast('Path relinked. The catalog now points to the new file.'); } render(); break; }
    case 'vt-unlock': vtUnlock(); break;
    case 'vt-lock': lockVault('Vault locked.'); break;
    case 'vt-skip': lockVault('Vault locked after '+(S.saved.timeout||5)+' minutes of inactivity. Enter your master password to continue.'); break;
    case 'vt-reveal': { const v=S.vault; if(v.revealed[id]){ clearTimeout(v.revealed[id]); delete v.revealed[id]; } else { v.revealed[id]=setTimeout(()=>{ delete v.revealed[id]; if(route().page==='vault') render(); },10000); } render(); break; }
    case 'vt-copy': toast('Copied to clipboard'); break;
    case 'nt-new': { const n={id:'n'+(S.notes.length+1),title:'Untitled note',project:'',edited:TODAY+' '+NOW,body:''}; S.notes.unshift(n); S.saveState='saved'; S.saveTime='just now'; location.hash='#/notes/'+n.id; break; }
    case 'nt-retry': { const n=S.notes.find(x=>x.id===route().id); commit(n); break; }
    case 'st-save': { const d=S.draft; if(d.def!=='win' && !d.paths[d.def].trim()){ S.settingsErr='Enter the path to the editor executable.'; S.settingsOk=false; render(); break; }
      S.settingsErr=''; S.saved=JSON.parse(JSON.stringify(d)); S.settingsOk=true; if(S.vault.unlocked) resetIdle(); render(); toast('Settings saved'); break; }
    case 'st-reset': S.draft=JSON.parse(JSON.stringify(S.saved)); S.settingsErr=''; S.settingsOk=false; render(); break;
  }
});
document.addEventListener('input', e=>{
  resetIdle(); const t=e.target;
  if(t.dataset.d){ S.dialog[t.dataset.d]=t.value; }
  if(t.id==='pq'){ S.pal.q=t.value; S.pal.sel=0; palDraw(); }
  if(t.dataset.sp){ S.draft.paths[t.dataset.sp]=t.value; S.settingsOk=false; }
});
document.addEventListener('change', e=>{
  const t=e.target;
  if(t.dataset.cf){ S.cfg[t.dataset.cf]=t.value; render(); }
  if(t.dataset.vf){ S.vault[t.dataset.vf]=t.value; render(); }
  if(t.dataset.nf){ S.noteFilter=t.value; render(); }
  if(t.dataset.st==='def'){ S.draft.def=t.value; S.settingsErr=''; S.settingsOk=false; render(); }
  if(t.dataset.st==='timeout'){ S.draft.timeout=+t.value; S.settingsOk=false; }
  /* demo toggles are handled in the click handler */
});
document.addEventListener('keydown', e=>{
  resetIdle();
  if((e.ctrlKey||e.metaKey) && e.key.toLowerCase()==='k'){ e.preventDefault(); S.pal={q:'',sel:0}; palDraw(); return; }
  if(S.pal){
    if(e.key==='Escape'){ S.pal=null; palDraw(); }
    else if(e.key==='ArrowDown'){ e.preventDefault(); S.pal.sel=Math.min(S.pal.items.length-1,S.pal.sel+1); palDraw(); }
    else if(e.key==='ArrowUp'){ e.preventDefault(); S.pal.sel=Math.max(0,S.pal.sel-1); palDraw(); }
    else if(e.key==='Enter'){ e.preventDefault(); palGo(S.pal.sel); }
    return;
  }
  if(e.key==='Escape'){ if(S.dialog){ S.dialog=null; dlgDraw(); } else if(S.cfgMenu){ S.cfgMenu=null; render(); } return; }
  if(e.key==='Enter' && e.target.id==='mp') vtUnlock();
  if(e.key==='Enter' && e.target.id==='rl-in') $('[data-act=rl-apply]').click();
  if(e.key==='Enter' && e.target.id==='cr-in') $('[data-act=cr-apply]').click();
});
function vtUnlock(){
  const v=S.vault, pw=$('#mp').value;
  if(!pw){ v.err='Enter your master password.'; render(); return; }
  if(pw!=='shelf-demo-2026'){ v.attempts++; v.err='Master password is incorrect. Try again.'; render(); return; }
  v.unlocked=true; v.err=''; v.msg=''; v.attempts=0; v.secs=(S.saved.timeout||0)*60; renderSideAndView();
}

startTick();
renderSideAndView();
</script>
