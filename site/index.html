<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      (function () {
        try {
          var stored = localStorage.getItem("devshelf.theme");
          var theme =
            stored === "light" || stored === "dark"
              ? stored
              : matchMedia("(prefers-color-scheme: light)").matches
                ? "light"
                : "dark";
          document.documentElement.dataset.theme = theme;
        } catch (e) {
          document.documentElement.dataset.theme = "dark";
        }
      })();
    </script>
    <title>DevShelf: a local-first project shelf for Windows developers</title>
    <meta
      name="description"
      content="DevShelf is a Windows desktop app that organizes your projects, workspaces, config files, notes and an encrypted secrets vault. No cloud, no sync, no telemetry."
